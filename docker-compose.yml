services:
  postgres:
    image: postgres:16-alpine
    container_name: cockpit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      POSTGRES_DB: cockpit
    ports:
      - "5439:5432"
    volumes:
      - cockpit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cockpit_pgdata:
